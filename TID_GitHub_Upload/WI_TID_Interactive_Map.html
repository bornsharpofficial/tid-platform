var statusFilter='all', typeFilter='all', countyFilter='all', searchVal='';
var map, markerLayer;

var statusColors={'Active':'#2E7D32','Expiring Soon':'#F9A825','Expired':'#C62828'};

function makeIcon(status){
  var color=statusColors[status]||'#2E5FA3';
  return L.divIcon({
    className:'',
    html:'<div style="width:10px;height:10px;background:'+color+';border-radius:50%;border:1.5px solid rgba(255,255,255,.85);box-shadow:0 1px 4px rgba(0,0,0,.5)"></div>',
    iconSize:[10,10],iconAnchor:[5,5]
  });
}

function initMap(){
  map=L.map('map',{center:[44.5,-89.5],zoom:7});

  // Use Esri World Street Map — works from local files, no referer required
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{
    attribution:'Tiles &copy; Esri &mdash; Sources: Esri, HERE, Garmin, USGS, Intermap, INCREMENT P, NRCAN, Esri Japan, METI, Esri China (Hong Kong), Esri Korea, Esri (Thailand), NGCC, &copy; OpenStreetMap contributors, GIS Community',
    maxZoom:19
  }).addTo(map);

  markerLayer=L.markerClusterGroup({
    maxClusterRadius:40,
    iconCreateFunction:function(cluster){
      var n=cluster.getChildCount();
      var s=n>100?44:n>50?36:n>10?28:22;
      return L.divIcon({
        html:'<div style="width:'+s+'px;height:'+s+'px;background:#1F3864;border-radius:50%;border:2px solid #BDD7EE;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.35)">'+n+'</div>',
        className:'',iconSize:[s,s],iconAnchor:[s/2,s/2]
      });
    }
  });

  buildCountyDropdown();
  buildMarkers(ALL_DATA);
  updateStats(ALL_DATA);
}

function buildCountyDropdown(){
  var counties=[...new Set(ALL_DATA.map(d=>d.county))].sort();
  var sel=document.getElementById('county-filter');
  counties.forEach(function(c){
    var o=document.createElement('option');
    o.value=c;
    o.textContent=c.charAt(0)+c.slice(1).toLowerCase()+' County';
    sel.appendChild(o);
  });
}

function buildMarkers(data){
  markerLayer.clearLayers();
  data.forEach(function(d){
    var m=L.marker([d.lat,d.lon],{icon:makeIcon(d.status)});
    m.on('click',function(){showSidebar(d);});
    markerLayer.addLayer(m);
  });
  if(!map.hasLayer(markerLayer)) map.addLayer(markerLayer);
  document.getElementById('shown-count').textContent=data.length.toLocaleString();
}

function showSidebar(d){
  document.getElementById('sidebar-title').textContent=d.full_muni+' — TID #'+d.tid;
  var sc=d.status==='Active'?'s-active':d.status==='Expiring Soon'?'s-expiring':'s-expired';
  var rows=[
    ['County',d.county.charAt(0)+d.county.slice(1).toLowerCase()+' County'],
    ['Municipality',d.full_muni],
    ['TID Number','#'+d.tid],
    ['Type',d.type_desc],
    ['Base Year',d.base_yr],
    ['Resolution Date',d.res_date],
    ['Maximum Life',d.max_life],
    ['Life Extended',d.life_ext||'—'],
    ['Effective End Date',d.eff_end],
    ['Years Remaining',d.yrs_rem!==''?d.yrs_rem+' yrs':'—'],
    ['Status','<span class="status-badge '+sc+'">'+d.status+'</span>'],
  ];
  var html=rows.map(function(r){
    return '<div class="info-row"><span class="info-label">'+r[0]+'</span><span class="info-val">'+r[1]+'</span></div>';
  }).join('');
  html+='<div class="action-btns">';
  html+='<a class="action-btn btn-loopnet" href="'+d.loopnet+'" target="_blank">&#128269; Search LoopNet (Commercial)</a>';
  html+='<a class="action-btn btn-propwire" href="'+d.propwire+'" target="_blank">&#128100; Search PropWire (Owner Data)</a>';
  html+='<a class="action-btn btn-zillow" href="https://www.zillow.com/homes/'+encodeURIComponent(d.muni)+'-WI/" target="_blank">&#127968; Search Zillow (Residential)</a>';
  html+='<a class="action-btn btn-land" href="https://www.landwatch.com/wisconsin-land-for-sale/'+d.county.toLowerCase().replace(/ /g,'-')+'-county" target="_blank">&#127807; LandWatch (Vacant Land)</a>';
  html+='<a class="action-btn btn-county" href="https://publicrecords.netronline.com/state/WI" target="_blank">&#127963; County Land Records</a>';
  html+='</div>';
  document.getElementById('sidebar-body').innerHTML=html;
  document.getElementById('sidebar').style.display='block';
}

function closeSidebar(){document.getElementById('sidebar').style.display='none';}

function getFiltered(){
  return ALL_DATA.filter(function(d){
    if(statusFilter!=='all'&&d.status!==statusFilter) return false;
    if(typeFilter!=='all'&&!d.type_desc.startsWith(typeFilter)) return false;
    if(countyFilter!=='all'&&d.county!==countyFilter) return false;
    if(searchVal){
      var s=searchVal.toLowerCase();
      if(!d.muni.toLowerCase().includes(s)&&!d.county.toLowerCase().includes(s)&&!d.tid.toLowerCase().includes(s)&&!d.full_muni.toLowerCase().includes(s)) return false;
    }
    return true;
  });
}

function applyFilters(){
  var filtered=getFiltered();
  buildMarkers(filtered);
  updateStats(filtered);
}

function updateStats(data){
  document.getElementById('stat-active').textContent=data.filter(d=>d.status==='Active').length.toLocaleString();
  document.getElementById('stat-expiring').textContent=data.filter(d=>d.status==='Expiring Soon').length.toLocaleString();
  document.getElementById('stat-expired').textContent=data.filter(d=>d.status==='Expired').length.toLocaleString();
}

function filterStatus(val,btn){
  document.querySelectorAll('#controls .filter-btn').forEach(function(b){
    if(b.getAttribute('onclick')&&b.getAttribute('onclick').startsWith('filterStatus')) b.classList.remove('active');
  });
  btn.classList.add('active');
  statusFilter=val; applyFilters();
}

function filterType(val){typeFilter=val;applyFilters();}

function filterCounty(val){
  countyFilter=val; applyFilters();
  if(val!=='all'){
    var pts=getFiltered();
    if(pts.length){
      var lats=pts.map(d=>d.lat),lons=pts.map(d=>d.lon);
      map.fitBounds([[Math.min(...lats)-.05,Math.min(...lons)-.05],[Math.max(...lats)+.05,Math.max(...lons)+.05]]);
    }
  } else { map.setView([44.5,-89.5],7); }
}

function searchTIDs(val){searchVal=val;applyFilters();}

function resetFilters(){
  statusFilter='all';typeFilter='all';countyFilter='all';searchVal='';
  document.getElementById('type-filter').value='all';
  document.getElementById('county-filter').value='all';
  document.getElementById('search-input').value='';
  document.querySelectorAll('#controls .filter-btn').forEach(function(b,i){b.classList.toggle('active',i===0);});
  applyFilters();
  map.setView([44.5,-89.5],7);
}

window.addEventListener('load',initMap);
</script>

        // Try to trigger search button
        var btn = document.querySelector('.search-btn') ||
